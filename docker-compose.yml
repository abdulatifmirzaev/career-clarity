services:
  postgres:
    image: postgres:16-alpine
    container_name: career-clarity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-career_clarity_prod}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-career_user} -d ${POSTGRES_DB:-career_clarity_prod}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: career-clarity-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-career_user}:${POSTGRES_PASSWORD:-career_secret_pass}@postgres:5432/${POSTGRES_DB:-career_clarity_prod}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-career_clarity_access_token_secret_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-career_clarity_refresh_token_secret_key_2026}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: career-clarity-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
    driver: local
